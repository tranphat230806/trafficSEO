<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEO & Website Traffic Dashboard</title>

  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/sidebar.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>

<body>

  <!-- Loading Overlay -->
  <div class="loading-overlay" id="loading-overlay">

  <div id="app">

      <div class="sidebar-header">

      <nav class="sidebar-nav">

        <a href="#seo" class="nav-item"><i class="fa-solid fa-chart-line"></i> Hiệu Suất SEO</a>
        <a href="#keywords" class="nav-item"><i class="fa-solid fa-magnifying-glass"></i> Thứ Hạng Từ Khóa</a>
        <a href="#landing-pages" class="nav-item"><i class="fa-solid fa-file-lines"></i> Landing Pages</a>
      </nav>

      <div class="sidebar-footer">
        Dữ liệu từ Google API<br>
        Không sử dụng dữ liệu giả.
      </div>
    </aside>

    <!-- Main Content -->
    <main id="main-content">



      <!-- App Content Area (Dynamic) -->
      <div id="app-content">
        <!-- JS Router injects content here -->
      </div>

    </main>

  </div>

  <!-- App Script -->
  <script type="module" src="js/app.js"></script>

</body>

</html>
